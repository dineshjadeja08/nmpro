# Builds one website image. Used by deploy-site.sh; substitutions:
#   _APP   web | admin | operations | technician
#   _IMAGE full Artifact Registry image name with tag
#   _API_BASE_URL, _SITE_URL, _PARTNER_APP_URL and the optional Firebase / Maps keys (public values)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infrastructure/docker/site.Dockerfile
      - --build-arg
      - APP=${_APP}
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_PARTNER_APP_URL=${_PARTNER_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
substitutions:
  _SITE_URL: ""
  _PARTNER_APP_URL: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""
  _GOOGLE_MAPS_API_KEY: ""
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
