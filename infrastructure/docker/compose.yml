services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nammapros_dev
      POSTGRES_USER: nammapros_dev
      POSTGRES_PASSWORD: local_development_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["nammapros_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nammapros_dev -d nammapros_dev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["nammapros_redis:/data"]
volumes:
  nammapros_pg:
  nammapros_redis:
